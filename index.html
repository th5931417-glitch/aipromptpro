<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompts Library - AIPromptPro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#181818] sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wide">AI Prompts Library</h1>
        <a href="https://app.dodopayments.com/buy" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded-full border border-gray-700 font-medium">
            🔒 Premium Pass
        </a>
    </header>

    <!-- Main Container -->
    <main class="p-4 max-w-xl mx-auto w-full flex-grow pb-20">
        <!-- Search Bar -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="🔍 Search prompts..." class="w-full bg-[#1e1e1e] border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-gray-600">
        </div>

        <!-- Product Hunt Banner -->
        <div class="mb-6 bg-[#1b1b1b] border border-gray-800 rounded-xl p-3 flex justify-between items-center">
            <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Find us on</span>
            <div class="flex items-center gap-2 bg-black px-3 py-1.5 rounded-lg border border-gray-800">
                <span class="font-bold text-sm">P</span>
                <span class="text-sm font-bold">Product Hunt</span>
                <span class="bg-gray-800 text-xs px-1.5 py-0.5 rounded text-gray-300 font-bold ml-1">▲ 2</span>
            </div>
        </div>

        <!-- Prompts List -->
        <div id="promptsList" class="space-y-3">
            <!-- Item 1: Free -->
            <div onclick="openPrompt('Viral Hook Generator', 'Social Media', 'Act as a top-tier viral content strategist. Generate 10 high-converting hooks for a video about [Topic]. Make 5 emotional and 5 curiosity-driven.', 'Viral, Youtube, Reels', false)" class="bg-[#1a1a1a] hover:bg-[#222] border border-gray-800/80 p-4 rounded-xl cursor-pointer transition flex justify-between items-center">
                <div>
                    <h3 class="font-semibold text-base">Viral Hook Generator</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Social Media</p>
                </div>
                <span class="text-gray-500 font-mono">›</span>
            </div>

            <!-- Item 2: Free -->
            <div onclick="openPrompt('SEO Article Outline', 'SEO & Content', 'Generate a comprehensive SEO-optimized article outline for the keyword [Keyword] targeting search intent.', 'SEO, Content', false)" class="bg-[#1a1a1a] hover:bg-[#222] border border-gray-800/80 p-4 rounded-xl cursor-pointer transition flex justify-between items-center">
                <div>
                    <h3 class="font-semibold text-base">SEO Article Outline</h3>
                    <p class="text-xs text-gray-400 mt-0.5">SEO & Content</p>
                </div>
                <span class="text-gray-500 font-mono">›</span>
            </div>

            <!-- Item 3: Premium -->
            <div onclick="openPrompt('SaaS Pitch Deck Copy', 'Business Strategy', '', '', true)" class="bg-[#1a1a1a] hover:bg-[#222] border border-gray-800/80 p-4 rounded-xl cursor-pointer transition flex justify-between items-center">
                <div>
                    <h3 class="font-semibold text-base flex items-center gap-1.5">SaaS Pitch Deck Copy <span class="text-xs">🔒</span></h3>
                    <p class="text-xs text-gray-400 mt-0.5">Business Strategy</p>
                </div>
                <span class="text-gray-500 font-mono">›</span>
            </div>
        </div>
    </main>

    <!-- Modal / Detail View (Hidden by Default) -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 hidden z-50 p-4 flex items-center justify-center">
        <div class="bg-[#181818] border border-gray-800 w-full max-w-lg rounded-2xl p-5 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">✕</button>
            
            <div id="modalContent">
                <!-- Dynamic Content Will Load Here -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#141414] border-t border-gray-800 flex justify-around py-3 z-40 text-xs">
        <button class="flex flex-col items-center text-white">
            <span class="text-lg">🗂️️</span>
            <span class="mt-1">Items</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span class="text-lg">📁</span>
            <span class="mt-1">Categories</span>
        </button>
        <button onclick="openPrivacy()" class="flex flex-col items-center text-gray-400">
            <span class="text-lg">📊</span>
            <span class="mt-1">Privacy Policy</span>
        </button>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        const modal = document.getElementById('detailModal');
        const modalContent = document.getElementById('modalContent');

        function openPrompt(title, category, description, tags, isPremium) {
            modal.classList.remove('hidden');
            if (isPremium) {
                modalContent.innerHTML = `
                    <h2 class="text-xl font-bold mb-1">${title}</h2>
                    <p class="text-xs text-gray-400 mb-6">${category}</p>
                    <div class="text-center py-8">
                        <div class="text-3xl mb-2">🔒</div>
                        <h3 class="text-lg font-bold mb-2">This is a Premium Prompt!</h3>
                        <p class="text-xs text-gray-400 mb-6 px-4">Upgrade to Premium Pass to unlock this prompt along with all exclusive AI prompts.</p>
                        <a href="https://app.dodopayments.com/buy" target="_blank" class="block w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 py-3 rounded-xl font-semibold text-sm transition">
                            Buy Now - $4.99/mo
                        </a>
                    </div>
                `;
            } else {
                modalContent.innerHTML = `
                    <h2 class="text-xl font-bold mb-1">${title}</h2>
                    <p class="text-xs text-gray-400 mb-4">${category}</p>
                    <div class="mb-4">
                        <span class="text-xs text-gray-500 uppercase tracking-wider block mb-1 font-semibold">Description</span>
                        <p class="text-sm text-gray-300 bg-[#1f1f1f] p-3 rounded-lg border border-gray-800">${description}</p>
                    </div>
                    <div class="mb-6">
                        <span class="text-xs text-gray-500 uppercase tracking-wider block mb-1 font-semibold">Tags</span>
                        <p class="text-xs text-gray-400">${tags}</p>
                    </div>
                    <div class="space-y-2">
                        <button onclick="alert('Prompt Copied!')" class="w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-semibold text-sm transition border border-gray-700">Copy prompt</button>
                        <a href="https://chatgpt.com" target="_blank" class="block text-center w-full bg-[#1f1f1f] hover:bg-[#252525] py-3 rounded-xl font-semibold text-sm transition border border-gray-800">Run in ChatGPT 🚀</a>
                    </div>
                `;
            }
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        function openPrivacy() {
            modal.classList.remove('hidden');
            modalContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Privacy Policy & Terms of Service</h2>
                <div class="text-xs text-gray-300 space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                    <p><strong>1. General Overview:</strong> Welcome to AIPromptPro. By accessing and using our Progressive Web App (PWA), you agree to comply with these terms.</p>
                    <p><strong>3. Payments & Subscriptions:</strong> AIPromptPro is offered as a monthly subscription service priced at $4.99 USD/month. All financial transactions are securely processed through <strong>Dodo Payments</strong>.</p>
                    <p><strong>5. Refund Policy:</strong> Subscription payments are generally non-refundable once billed. However, refund requests submitted within 7 days of purchase will be evaluated on a case-by-case basis.</p>
                    <p><strong>8. Support & Contact:</strong> If you have any questions, please contact us at: <span class="text-blue-400">th5931417@gmail.com</span></p>
                </div>
            `;
        }
    </script>
</body>
  </html>
